<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16184e" />
  <title>Cyber Threat Globe – Deutsche Bank</title>
  <script type="module" crossorigin src="./assets/index-CRtmCt5_.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CSxzayeJ.css">
</head>
<body>
  <div id="app">

    <!-- Globe canvas container -->
    <div id="globe-container"></div>

    <!-- Top bar -->
    <header id="top-bar">
      <div id="logo-area">
        <span class="db-mark">■</span>
        <span class="db-label">Deutsche Bank</span>
        <span class="divider">|</span>
        <span class="page-title">Cyber Threat Globe</span>
      </div>
      <div id="live-badge">
        <span class="pulse-dot"></span>
        Live
      </div>
    </header>

    <!-- Stats overlay -->
    <div id="stats-overlay">
      <div class="stat-block" id="stat-today">
        <div class="stat-value" id="counter-today">0</div>
        <div class="stat-label">Angriffe heute</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block" id="stat-per-sec">
        <div class="stat-value" id="counter-per-sec">0</div>
        <div class="stat-label">pro Sekunde</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block">
        <div class="stat-value" id="counter-countries">0</div>
        <div class="stat-label">Länder betroffen</div>
      </div>
    </div>

    <!-- Attack type legend -->
    <div id="legend">
      <div class="legend-item">
        <span class="legend-dot" style="background:#e7001d"></span>
        <span>Ransomware</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background:#f28011"></span>
        <span>Phishing</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background:#25a62d"></span>
        <span>DDoS</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background:#34a6dc"></span>
        <span>Datenleck</span>
      </div>
    </div>

    <!-- Latest attack ticker -->
    <div id="ticker">
      <div id="ticker-label">Letzter Angriff</div>
      <div id="ticker-text">Initialisiere Feed…</div>
    </div>

    <!-- Touch hint (shown briefly) -->
    <div id="touch-hint">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 11l3 3L22 4"/>
        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10"/>
      </svg>
      <span>Globus drehen</span>
    </div>

  </div>

  <script>
    /* Touch-/Kiosk-Härtung: Kontextmenü + Pinch-/Strg-Zoom unterdrücken (Globus-Rotation/-Zoom via globe.gl bleibt aktiv) */
    addEventListener('contextmenu', function (e) { e.preventDefault(); });
    addEventListener('gesturestart', function (e) { e.preventDefault(); });
    addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) !== -1) e.preventDefault();
    });
  </script>
</body>
</html>
